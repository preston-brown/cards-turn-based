<header class="topbar">
  <a class="brand" routerLink="/rooms/new" aria-label="Card Table home">Card Table</a>
  <nav aria-label="Main navigation">
    <a
      class="nav-link"
      routerLink="/rooms/new"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      Create a Room
    </a>
    @if (loggedIn()) {
      <button class="nav-link" type="button" (click)="logOut()">Log Out</button>
    } @else {
      <button class="nav-link" type="button" (click)="logIn()">Log In</button>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
